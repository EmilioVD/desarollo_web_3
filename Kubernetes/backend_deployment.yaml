apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: fast-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-backend
  template:
    metadata:
      labels:
        app: fast-backend
    spec:
      containers:
       - name: backend-fast
         image: backend_productos:latest
         imagePullPolicy: IfNotPresent
         env:
           - name: MONGO_URI
             value: mongodb://admin:web3@mongo-service.default.svc.cluster.local:27017/
         ports:
           - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: fast-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP