services:
  mongo:
    image: mongo:latest
    container_name: mongo_container
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_user
      MONGO_INITDB_ROOT_PASSWORD: web3
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: backend_container
    environment:
      MONGO_URI: mongodb://admin_user:web3@mongo:27017/
    ports:
      - "8000:8000"
    depends_on:
      - mongo
